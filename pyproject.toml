[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryjax"
version = "0.1.0"
description = "The CRY 1.7 cosmic-ray shower model on JAX devices, with the C++ reference behind a small C ABI"
readme = "README.md"
license = {text = "Apache-2.0 AND BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
device = ["jax"]
compare = ["scipy"]
test = ["pytest", "jax", "scipy"]

[tool.setuptools.packages.find]
include = ["cryjax*"]

[tool.setuptools.package-data]
cryjax = ["native/*.cc", "native/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tables: needs the CRY 1.7 release tables ($CRYDATAPATH)", "shim: needs a built shim ($CRYJAX_SHIM)"]
